# Run Prometheus in the SAME host/network namespace as the application.
# A container on a separate bridge cannot reach the application's loopback listener.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: grownupsvet-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:9091"]
        labels:
          service_name: grownupsvet-backend
          revision_name: local
