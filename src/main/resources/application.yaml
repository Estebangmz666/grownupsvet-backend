spring:
  application:
    name: grownupsvet-backend

  profiles:
    default: dev

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# SQL exception messages can contain values from the failed row. The application
# logs only a correlation id, exception type and stack locations for unexpected errors.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

grownupsvet:
  availability:
    minimum-owner-lead-time: PT2H
    maximum-owner-horizon: P60D
  staff:
    bootstrap:
      enabled: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}
    invitations:
      enabled: ${STAFF_INVITATIONS_ENABLED:false}
      # TO-DO: replace with front portal production URL.
      activation-url: ${STAFF_ACTIVATION_URL:https://portal.example.invalid/activate-account}
      encryption-key: ${STAFF_INVITATION_ENCRYPTION_KEY:}
      sender-address: ${MAIL_FROM:}
      dispatch-delay: 15000
      max-delivery-attempts: 5
  security:
    password-recovery:
      enabled: ${PASSWORD_RECOVERY_ENABLED:false}
      hmac-secret: ${PASSWORD_RECOVERY_HMAC_SECRET:}
      sender-address: ${MAIL_FROM:}
    jwt:
      issuer: ${JWT_ISSUER:grownupsvet-backend}
      audience: ${JWT_AUDIENCE:grownupsvet-clients}
      access-token-ttl: PT24H
      clock-skew: PT30S
      key-store-path: ${JWT_KEYSTORE_PATH:}
      key-store-password: ${JWT_KEYSTORE_PASSWORD:}
      key-alias: ${JWT_KEY_ALIAS:grownupsvet-jwt-signing-2026-09}
      key-password: ${JWT_KEY_PASSWORD:${JWT_KEYSTORE_PASSWORD:}}
