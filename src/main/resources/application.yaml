spring:
  application:
    name: grownupsvet-backend

  profiles:
    default: dev

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

# SQL exception messages can contain values from the failed row. The application
# logs only a correlation id, exception type and stack locations for unexpected errors.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

grownupsvet:
  security:
    jwt:
      issuer: ${JWT_ISSUER:grownupsvet-backend}
      audience: ${JWT_AUDIENCE:grownupsvet-clients}
      access-token-ttl: PT24H
      clock-skew: PT30S
      key-store-path: ${JWT_KEYSTORE_PATH:}
      key-store-password: ${JWT_KEYSTORE_PASSWORD:}
      key-alias: ${JWT_KEY_ALIAS:grownupsvet-jwt-signing-2026-09}
      key-password: ${JWT_KEY_PASSWORD:${JWT_KEYSTORE_PASSWORD:}}
