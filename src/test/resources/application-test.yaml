spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/grownupsvet_test
    hikari:
      # Spring caches several integration-test contexts; keep their pools bounded.
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000
grownupsvet:
  appointments:
    workday-start-time: "00:00"
  security:
    password-recovery:
      enabled: false
      hmac-secret: ""
      sender-address: ""
